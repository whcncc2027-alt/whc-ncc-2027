<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B/HCW NCC - 2027</title>

  <link rel="icon" type="image/png" href="whc.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(circle at top, rgba(0, 200, 255, 0.2), transparent 40%),
        #050e1f;

      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER */
    .header {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 35px;

      padding: 18px 25px;

      background: rgba(8, 18, 35, 0.9);

      backdrop-filter: blur(12px);

      border-bottom: 2px solid rgba(0, 200, 255, 0.2);

      box-shadow: 0 0 30px rgba(0, 200, 255, 0.1);
    }

    /* LOGOS */
    .logo {
      width: 75px;
      height: 75px;

      object-fit: contain;

      transition: 0.3s;
    }

    .logo:hover {
      transform: scale(1.1) rotate(3deg);

      filter: drop-shadow(0 0 15px cyan);
    }

    /* TITLE */
    h1 {
      font-size: 40px;
      letter-spacing: 3px;

      text-align: center;

      text-shadow:
        0 0 10px rgba(0, 200, 255, 0.9),
        0 0 20px rgba(0, 200, 255, 0.5);
    }

    /* BUTTON AREA */
    .buttons {
      width: 100%;
      max-width: 400px;

      display: flex;
      flex-direction: column;

      gap: 25px;

      margin-top: 70px;

      padding: 20px;
    }

    /* BUTTONS */
    .buttons a {
      text-decoration: none;
    }

    .buttons button {
      width: 100%;

      padding: 18px;

      border: none;
      border-radius: 18px;

      background: linear-gradient(135deg, #00cfff, #0066ff);

      color: white;

      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;

      cursor: pointer;

      transition: 0.3s;

      box-shadow:
        0 0 15px rgba(0, 200, 255, 0.3),
        inset 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .buttons button:hover {
      transform: translateY(-5px) scale(1.03);

      box-shadow:
        0 0 30px cyan,
        0 0 50px rgba(0, 255, 255, 0.5);
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .header {
        gap: 15px;
        padding: 14px;
      }

      .logo {
        width: 55px;
        height: 55px;
      }

      h1 {
        font-size: 24px;
      }

      .buttons {
        margin-top: 50px;
      }

      .buttons button {
        font-size: 16px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">

    <img src="whc.png" class="logo">

    <h1>WHC NCC 2027</h1>

    <img src="ncc.png" class="logo">

  </div>

  <!-- BUTTONS -->
  <div class="buttons">

    <a href="https://whcncc2027-alt.github.io/whc-ncc-2027-learn/" target="_blank">
      <button>📘 Learn Cadet</button>
    </a>

    <a href="https://whcncc2027-alt.github.io/whc-ncc-2027-details/" target="_blank">
      <button>🎖️ Cadet Details</button>
    </a>

    <a href="https://whcncc2027-alt.github.io/whc-ncc-2027-register/" target="_blank">
      <button>✅ Attendance Mark</button>
    </a>

  </div>

</body>

</html>
